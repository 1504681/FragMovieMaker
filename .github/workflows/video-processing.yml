name: Video Processing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  process-videos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Create list of videos in chronological order
        run: |
          # List all videos
          echo "Listing all video files in videos directory:"
          ls -la videos/
          
          # Find video files and sort by creation time (support multiple formats)
          find ./videos -type f \( -name "*.mp4" -o -name "*.mkv" \) -printf "%T@ %p\n" | sort -n | cut -f2- -d" " > temp_list.txt
          
          # Show found files
          echo "Found these video files:"
          cat temp_list.txt
          
          # Format for FFmpeg concat
          sed 's/^/file /' temp_list.txt > video_list.txt
          
          # Show the order of processing
          echo "Video files to be processed in chronological order:"
          cat video_list.txt
      
      - name: Concatenate videos
        run: |
          mkdir -p output
          
          # Check if video_list.txt is empty
          if [ ! -s video_list.txt ]; then
            echo "Error: No videos found to concatenate"
            exit 1
          fi
          
          # Try to concatenate videos
          ffmpeg -f concat -safe 0 -i video_list.txt -c copy output/concatenated.mkv
      
      - name: Add music
        run: |
          # Check if background.mp3 exists
          if [ ! -f ./music/background.mp3 ]; then
            echo "Warning: background.mp3 not found, looking for alternatives..."
            ls -la ./music/
            # Find first mp3 file in music directory
            MUSIC_FILE=$(find ./music -name "*.mp3" | head -n 1)
            if [ -z "$MUSIC_FILE" ]; then
              echo "Error: No music file found"
              exit 1
            fi
            echo "Using $MUSIC_FILE instead"
          else
            MUSIC_FILE="./music/background.mp3"
          fi
          
          # Add music to video
          ffmpeg -i output/concatenated.mkv -i "$MUSIC_FILE" -map 0:v -map 1:a -c:v copy -shortest output/final_video.mp4
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-video
          path: output/final_video.mp4
          retention-days: 5

  deploy:
    needs: process-videos
    runs-on: ubuntu-latest
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: processed-video
          path: ./processed-video
      
      - name: Set up deployment environment
        run: echo "Setting up deployment environment"
        
      - name: Deploy video
        run: |
          echo "Deploying processed video to target platform"
          # Add your deployment commands here
          # Examples:
          # - Upload to S3: aws s3 cp ./processed-video/final_video.mp4 s3://your-bucket/
          # - Upload to YouTube: use youtube-upload or similar tool
          
      - name: Notify completion
        run: echo "Video processing and deployment complete"