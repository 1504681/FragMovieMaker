name: Video Processing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  process-videos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Check Git LFS files
        run: |
          # Check Git LFS installation
          git lfs install
          
          # List Git LFS tracked files
          echo "LFS tracked files:"
          git lfs ls-files
          
          # Pull LFS files explicitly
          echo "Pulling LFS files:"
          git lfs pull
          
          # Check the files in the videos directory
          echo "Listing video files with details:"
          ls -la videos/
          
          # Check file types
          echo "File types:"
          for file in videos/*; do
            echo "$file: $(file -b "$file")"
          done
      
      - name: Create list of videos and prepare for processing
        run: |
          # Find video files and sort by creation time (support multiple formats)
          find ./videos -type f \( -name "*.mp4" -o -name "*.mkv" \) -printf "%T@ %p\n" | sort -n | cut -f2- -d" " > temp_list.txt
          
          # Show found files
          echo "Found these video files:"
          cat temp_list.txt
          
          # Create a directory for extracted streams
          mkdir -p extracted
          
          # Extract video streams from each MKV file to ensure compatibility
          echo "Extracting video streams from MKV files:"
          for video in videos/*.mkv; do
            if [ -f "$video" ]; then
              basename=$(basename "$video" .mkv)
              echo "Processing $video..."
              ffmpeg -v warning -i "$video" -c:v copy -an "extracted/${basename}.mp4" || echo "Failed to extract $video"
            fi
          done
          
          # Check extracted files
          echo "Extracted files:"
          ls -la extracted/
          
          # Create a list of the extracted files
          find ./extracted -type f -name "*.mp4" | sort > extract_list.txt
          
          # Format for FFmpeg concat
          sed 's/^/file /' extract_list.txt > video_list.txt
          
          # Show the order of processing
          echo "Video files to be processed in chronological order:"
          cat video_list.txt
      
      - name: Alternative processing if extraction worked
        run: |
          mkdir -p output
          
          # Check if any extracted files were created
          if [ -s extract_list.txt ]; then
            echo "Using extracted files for concatenation"
            # Concatenate extracted files
            ffmpeg -f concat -safe 0 -i video_list.txt -c copy output/concatenated.mp4
          else
            echo "No extracted files available, trying direct processing"
            
            # Try a different approach - process each video individually and then combine
            echo "Processing videos one by one:"
            for video in videos/*.mkv; do
              if [ -f "$video" ]; then
                basename=$(basename "$video" .mkv)
                echo "Converting $video to MP4..."
                ffmpeg -v warning -i "$video" -c copy "output/${basename}.mp4" || echo "Failed to convert $video"
              fi
            done
            
            # List the converted files
            echo "Converted files:"
            ls -la output/
            
            # Create a list for the converted files
            find ./output -type f -name "*.mp4" | sort > output_list.txt
            
            # Format for FFmpeg concat
            sed 's/^/file /' output_list.txt > final_list.txt
            
            # Try to concatenate converted files
            echo "Concatenating converted files:"
            ffmpeg -f concat -safe 0 -i final_list.txt -c copy output/concatenated.mp4 || echo "Failed to concatenate"
          fi
          
          # Check if concatenation was successful
          if [ ! -f output/concatenated.mp4 ]; then
            echo "Concatenation failed, copying first video as fallback"
            # Just use the first video as a fallback
            cp $(find ./videos -type f \( -name "*.mp4" -o -name "*.mkv" \) | head -n 1) output/concatenated.mp4 || echo "Fallback failed"
          fi
      
      - name: Add music
        run: |
          # Check if concatenated.mp4 exists
          if [ ! -f output/concatenated.mp4 ]; then
            echo "No concatenated video found, cannot add music"
            exit 1
          fi
          
          # Check if background.mp3 exists
          if [ ! -f ./music/background.mp3 ]; then
            echo "Warning: background.mp3 not found, looking for alternatives..."
            ls -la ./music/
            # Try to find a music file with case-insensitive search
            MUSIC_FILE=$(find ./music -iname "*.mp3" | head -n 1)
            if [ -z "$MUSIC_FILE" ]; then
              echo "Error: No music file found"
              # Just copy the video without music as a fallback
              cp output/concatenated.mp4 output/final_video.mp4
              exit 0
            fi
            echo "Using $MUSIC_FILE instead"
          else
            MUSIC_FILE="./music/background.mp3"
          fi
          
          # Try to add music to video
          echo "Adding music from $MUSIC_FILE"
          ffmpeg -i output/concatenated.mp4 -i "$MUSIC_FILE" -map 0:v -map 1:a -c:v copy -shortest output/final_video.mp4 || cp output/concatenated.mp4 output/final_video.mp4
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-video
          path: output/final_video.mp4
          retention-days: 5

  deploy:
    needs: process-videos
    runs-on: ubuntu-latest
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: processed-video
          path: ./processed-video
      
      - name: Set up deployment environment
        run: echo "Setting up deployment environment"
        
      - name: Deploy video
        run: |
          echo "Deploying processed video to target platform"
          # Add your deployment commands here
          # Examples:
          # - Upload to S3: aws s3 cp ./processed-video/final_video.mp4 s3://your-bucket/
          # - Upload to YouTube: use youtube-upload or similar tool
          
      - name: Notify completion
        run: echo "Video processing and deployment complete"